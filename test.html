<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аниме Кинотеатр</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background: #121212; color: #fff; font-family: sans-serif; padding: 16px; margin: 0; }
        
        /* Экран блокировки для сторонних браузеров */
        .access-denied-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 85vh;
            text-align: center;
            padding: 24px;
        }
        .lock-icon { font-size: 64px; margin-bottom: 16px; }
        .denied-title { font-size: 22px; font-weight: bold; color: #ff4d4d; margin-bottom: 12px; }
        .denied-desc { font-size: 14px; color: #aaa; line-height: 1.6; max-width: 320px; }

        /* Основное приложение Telegram */
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .badge { background: #2e7d32; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; float: right; }
        button { width: 100%; padding: 14px; background: #f24b1f; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 8px; font-size: 14px; }
        button:active { transform: scale(0.98); }
        button.secondary { background: #333; }
        ul { padding-left: 20px; color: #ccc; }
        li { margin-bottom: 6px; }
    </style>
</head>
<body>

    <!-- 1. ЭКРАН БЛОКИРОВКИ (Виден ТОЛЬКО в обычных браузерах) -->
    <div id="access-denied-block" class="access-denied-screen" style="display: none;">
        <div class="lock-icon">🔒</div>
        <div class="denied-title">ДОСТУП ОГРАНИЧЕН</div>
        <div class="denied-desc">
            Настоящее приложение работает <b>исключительно во встроенном браузерe Telegram</b>.<br><br>
            Пожалуйста, откройте чат с нашим Telegram-ботом и нажмите кнопку <b>«Отрыть Приложение»</b>.
        </div>
    </div>

    <!-- 2. ОСНОВНОЙ ИНТЕРФЕЙС (Виден ТОЛЬКО из Telegram) -->
    <div id="main-app-block" style="display: none;">
        <div class="card">
            <span id="sync-status" class="badge">🔒 Telegram Вход</span>
            <h3 style="margin-top: 0;">Ваш Профиль</h3>
            <p><strong>Telegram ID:</strong> <span id="user-id" style="color: #4caf50; font-weight: bold; font-size: 16px;">...</span></p>
            <p><strong>Имя:</strong> <span id="user-name">...</span></p>
        </div>

        <div class="card">
            <h3>Просмотр контента</h3>
            <button onclick="addWatch('Посмотрел «Атака Титанов»')">+ «Атака Титанов»</button>
            <button onclick="addWatch('Посмотрел «Наруто»')">+ «Наруто»</button>
            <button onclick="addWatch('Посмотрел «Магическая битва»')">+ «Магическая битва»</button>
            
            <h4>Ваша история:</h4>
            <ul id="history-list"><li>Загрузка...</li></ul>

            <button class="secondary" onclick="clearHistory()">Очистить историю</button>
        </div>
    </div>

    <script>
        const API_URL = 'https://functions.yandexcloud.net/d4evib2sgptv8r0rvtht';

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Проверяем, открыто ли приложение ВНУТРИ Telegram
        const isInsideTelegram = !!(tg?.initData && tg?.initDataUnsafe?.user?.id);
        const realUser = tg?.initDataUnsafe?.user;
        const tgUserId = realUser?.id ? realUser.id.toString() : null;

        let userHistory = [];

        function checkEnvironment() {
            // Если открыто в обычном браузере (Chrome / Safari / Yandex)
            if (!isInsideTelegram) {
                document.getElementById('access-denied-block').style.display = 'flex';
                document.getElementById('main-app-block').style.display = 'none';
                return false;
            }

            // Если открыто внутри Telegram
            document.getElementById('access-denied-block').style.display = 'none';
            document.getElementById('main-app-block').style.display = 'block';

            document.getElementById('user-id').innerText = tgUserId;
            document.getElementById('user-name').innerText = realUser.first_name + (realUser.username ? ` (@${realUser.username})` : '');
            
            return true;
        }

        async function initApp() {
            if (!checkEnvironment()) return;
            await loadCloudData();
        }

        function loadCloudData() {
            return new Promise((resolve) => {
                const cloudKey = `history_${tgUserId}`;
                if (tg?.CloudStorage) {
                    tg.CloudStorage.getItem(cloudKey, (err, value) => {
                        if (!err && value) {
                            try { userHistory = JSON.parse(value); } catch(e) { userHistory = []; }
                        } else {
                            userHistory = [];
                        }
                        renderUI();
                        resolve();
                    });
                } else {
                    renderUI();
                    resolve();
                }
            });
        }

        function renderUI() {
            const list = document.getElementById('history-list');
            if (userHistory.length === 0) {
                list.innerHTML = '<li>Ваша история пуста</li>';
                return;
            }
            list.innerHTML = userHistory.map(item => `
                <li><b>${item.title}</b> <small style="color:#888;">(${item.time})</small></li>
            `).join('');
        }

        async function addWatch(title) {
            const newItem = { title: title, time: new Date().toLocaleTimeString('ru-RU') };
            userHistory.unshift(newItem);
            renderUI();

            const cloudKey = `history_${tgUserId}`;
            if (tg?.CloudStorage) {
                tg.CloudStorage.setItem(cloudKey, JSON.stringify(userHistory));
            }

            syncChannelBackground();
        }

        async function clearHistory() {
            userHistory = [];
            renderUI();
            const cloudKey = `history_${tgUserId}`;
            if (tg?.CloudStorage) {
                tg.CloudStorage.setItem(cloudKey, JSON.stringify([]));
            }
            syncChannelBackground();
        }

        function syncChannelBackground() {
            document.getElementById('sync-status').innerText = '⚡ Синхронизация...';

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'update_channel',
                    initData: tg?.initData || "",
                    history: userHistory
                })
            }).then(res => {
                if (res.status === 403) {
                    document.getElementById('sync-status').innerText = '⛔ Доступ запрещен';
                } else {
                    document.getElementById('sync-status').innerText = '⚡ Синхронизировано';
                }
            }).catch(() => {
                document.getElementById('sync-status').innerText = '⚡ Локально сохранено';
            });
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
