<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест - Настоящая авторизация Telegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #121212; color: #fff; font-family: sans-serif; padding: 16px; margin: 0; }
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .badge { background: #2e7d32; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
        .badge-admin { background: #d32f2f; }
        .banner { background: #ff9800; color: #000; padding: 8px; border-radius: 6px; font-weight: bold; margin-bottom: 15px; text-align: center; }
        input { width: calc(100% - 22px); padding: 10px; margin: 6px 0 10px; border-radius: 6px; border: 1px solid #444; background: #111; color: #fff; }
        button { width: 100%; padding: 10px; background: #f24b1f; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
        button.secondary { background: #444; }
    </style>
</head>
<body>

    <div id="view-banner" class="banner" style="display: none;">
        👀 Просмотр за другого пользователя
    </div>

    <div class="card">
        <span id="auth-badge" class="badge">🔒 Настоящий аккаунт</span>
        <h3>Ваш профиль</h3>
        <p><strong>Подлинный Telegram ID:</strong> <span id="real-tg-id">Загрузка...</span></p>
        <p><strong>Просматриваемый ID:</strong> <span id="target-tg-id">Загрузка...</span></p>
        <p><strong>Права Администратора:</strong> <span id="admin-status">...</span></p>
    </div>

    <div class="card">
        <h3>Действия и Синхронизация</h3>
        <button onclick="addWatchHistory('Посмотрел аниме «Блич»', '103')">+ «Блич»</button>
        <h4>История:</h4>
        <ul id="history-list"><li>Загрузка с сервера...</li></ul>
        <button class="secondary" onclick="clearHistory()">Очистить историю</button>
    </div>

    <div id="admin-panel" class="card" style="display: none;">
        <h3>Режим Админа: Посмотреть чужой профиль</h3>
        <input type="text" id="target-id" placeholder="Введи чужой TG ID">
        <button onclick="switchUser()">Загрузить профиль юзера</button>
        <button class="secondary" onclick="resetUser()">Сбросить на свой ID</button>
    </div>

    <script>
        const API_URL = 'YOUR_YANDEX_CLOUD_FUNCTION_URL'; // Вставьте ссылку на функцию

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        let currentUserState = { items: {}, history: [], anime_titles: {}, message_id: null };
        let isUserAdmin = false;

        // Получаем сырой зашифрованный подлинный initData от Telegram
        function getInitData() {
            return tg?.initData || "";
        }

        async function syncLoad() {
            const viewAsId = localStorage.getItem('view_as_id');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'load',
                        initData: getInitData(),
                        view_as_id: viewAsId
                    })
                });

                const res = await response.json();

                if (!res.success) {
                    alert("Ошибка авторизации: " + res.error);
                    return;
                }

                // Отображаем настоящие проверенные данные
                document.getElementById('real-tg-id').innerText = res.real_user_id;
                document.getElementById('target-tg-id').innerText = res.target_user_id;
                document.getElementById('admin-status').innerText = res.is_admin ? "ДА (Доступен режим просмотра)" : "НЕТ";
                
                isUserAdmin = res.is_admin;
                document.getElementById('admin-panel').style.display = isUserAdmin ? 'block' : 'none';
                document.getElementById('view-banner').style.display = (res.real_user_id !== res.target_user_id) ? 'block' : 'none';

                currentUserState = res.data;
                renderUI();

            } catch (e) {
                console.error("Ошибка загрузки:", e);
            }
        }

        async function syncSave() {
            const viewAsId = localStorage.getItem('view_as_id');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'save',
                        initData: getInitData(),
                        view_as_id: viewAsId,
                        items: currentUserState.items,
                        history: currentUserState.history,
                        anime_titles: currentUserState.anime_titles,
                        message_id: currentUserState.message_id
                    })
                });

                const res = await response.json();
                if (res.success && res.message_id) {
                    currentUserState.message_id = res.message_id;
                }
            } catch (e) {
                console.error("Ошибка сохранения:", e);
            }
        }

        function renderUI() {
            const list = document.getElementById('history-list');
            const history = currentUserState.history || [];
            if (history.length === 0) {
                list.innerHTML = '<li>История пуста</li>';
                return;
            }
            list.innerHTML = history.map(i => `<li>${i.title} <small>(${i.time})</small></li>`).join('');
        }

        async function addWatchHistory(title, id) {
            currentUserState.history.unshift({ title, time: new Date().toLocaleTimeString('ru-RU') });
            currentUserState.items[id] = { is_fav: true, status: 'watching', rating: 10 };
            currentUserState.anime_titles[id] = title;
            renderUI();
            await syncSave();
        }

        async function clearHistory() {
            currentUserState.history = [];
            currentUserState.items = {};
            renderUI();
            await syncSave();
        }

        async function switchUser() {
            const id = document.getElementById('target-id').value.trim();
            if (!id) return;
            localStorage.setItem('view_as_id', id);
            await syncLoad();
        }

        async function resetUser() {
            localStorage.removeItem('view_as_id');
            await syncLoad();
        }

        document.addEventListener('DOMContentLoaded', syncLoad);
    </script>
</body>
</html>
