<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовая страница - Профиль</title>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .status-badge {
            display: inline-block;
            background: #f24b1f;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .impersonate-box {
            background: #252525;
            border: 1px dashed #f24b1f;
            border-radius: 12px;
            padding: 16px;
        }

        input {
            width: calc(100% - 20px);
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #f24b1f;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        button.secondary {
            background: #444;
            margin-top: 8px;
        }

        .banner {
            background: #ff9800;
            color: #000;
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Баннер, если смотрим чужой аккаунт -->
    <div id="view-banner" class="banner" style="display: none;">
        👀 Режим просмотра другого пользователя
    </div>

    <!-- Карточка пользователя -->
    <div class="card">
        <h3>Мой Профиль</h3>
        <p><strong>Telegram ID:</strong> <span id="user-id">Загрузка...</span></p>
        <p><strong>Никнейм:</strong> <span id="user-name">Загрузка...</span></p>
        <p><strong>Статус:</strong> <span class="status-badge" id="user-status">Игрок</span></p>
        <p><strong>Рейтинг:</strong> <span id="user-rating">100</span> PTS</p>
    </div>

    <!-- Панель "Посмотреть за другого" -->
    <div class="impersonate-box">
        <h3>Посмотреть за другого юзера</h3>
        <label for="target-id">Введи Telegram ID пользователя:</label>
        <input type="text" id="target-id" placeholder="Например: 987654321">
        
        <button onclick="switchUser()">Смотреть профиль</button>
        <button class="secondary" onclick="resetUser()">Вернуться в свой аккаунт</button>
    </div>

    <script>
        // Инициализация Telegram
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // 1. Определение текущего/своего TG ID
        function getMyId() {
            if (tg?.initDataUnsafe?.user?.id) {
                return tg.initDataUnsafe.user.id.toString();
            }
            // Если открыто просто в браузере — сгенерируем/возьмем дефолтный ID
            let myId = localStorage.getItem('my_tg_id');
            if (!myId) {
                myId = '100001'; 
                localStorage.setItem('my_tg_id', myId);
            }
            return myId;
        }

        const myTgId = getMyId();

        // 2. Отрисовка данных на странице
        function renderProfile() {
            // Проверяем, смотрим ли за кого-то другого
            const activeId = localStorage.getItem('view_as_id') || myTgId;
            const isOtherUser = activeId !== myTgId;

            // Показываем/скрываем предупреждающий баннер
            document.getElementById('view-banner').style.display = isOtherUser ? 'block' : 'none';

            // Заполняем интерфейс данными
            document.getElementById('user-id').innerText = activeId;
            
            if (isOtherUser) {
                document.getElementById('user-name').innerText = `@user_${activeId}`;
                document.getElementById('user-status').innerText = "Гость (Просмотр)";
                document.getElementById('user-rating').innerText = "250"; // Фейковые данные для теста
            } else {
                const tgName = tg?.initDataUnsafe?.user?.username;
                document.getElementById('user-name').innerText = tgName ? `@${tgName}` : `@user_${myTgId}`;
                document.getElementById('user-status').innerText = "Владелец";
                document.getElementById('user-rating').innerText = "100";
            }
        }

        // 3. Переключиться на чужой ID
        function switchUser() {
            const inputId = document.getElementById('target-id').value.trim();
            if (!inputId) return alert("Введи Telegram ID!");

            localStorage.setItem('view_as_id', inputId);
            document.getElementById('target-id').value = '';
            renderProfile();
        }

        // 4. Вернуться в свой аккаунт
        function resetUser() {
            localStorage.removeItem('view_as_id');
            renderProfile();
        }

        // Запуск при открытии страницы
        document.addEventListener('DOMContentLoaded', renderProfile);
    </script>
</body>
</html>
