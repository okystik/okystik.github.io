<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AniPanda - Народный Рейтинг</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #111111; color: #ffffff; padding-bottom: 70px; user-select: none; }

        .tab-content { display: none; padding: 12px; max-width: 1000px; margin: 0 auto; }
        .tab-content.active { display: block; }

        /* Сетка Плиток */
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
        @media (min-width: 480px) { .cards-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; } }

        .card-tile { background: #1f1f1f; border: 1px solid #2a2a2a; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
        .poster-wrapper { position: relative; width: 100%; height: 200px; overflow: hidden; background: #181818; }
        .poster-wrapper img { width: 100%; height: 100%; object-fit: cover; }

        /* Настоящий живой плашка-рейтинг на обложке */
        .rating-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            background-color: rgba(17, 17, 17, 0.92);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            color: #ffcc00;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,204,0,0.3);
        }

        .card-details { padding: 10px; }
        .card-details h3 { font-size: 14px; font-weight: bold; color: #ececec; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .status-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin: 8px 0; }
        .btn-status { padding: 6px 2px; font-size: 10px; background: #282828; color: #aaa; border: 1px solid #383838; border-radius: 6px; cursor: pointer; text-align: center; font-weight: bold; }
        .btn-status.act-watching { background: #1976d2; color: #fff; }
        .btn-status.act-completed { background: #2e7d32; color: #fff; }
        .btn-status.act-planned { background: #ed6c02; color: #fff; }
        .btn-status.act-dropped { background: #d32f2f; color: #fff; }

        /* Выставление своей оценки */
        .personal-rating-box { background: #141414; padding: 6px 8px; border-radius: 6px; margin-top: 6px; }
        .personal-rating-title { display: flex; justify-content: space-between; font-size: 10px; color: #888; margin-bottom: 4px; }
        .star-bar { display: flex; justify-content: space-between; }
        .star-bar .star { font-size: 14px; color: #383838; cursor: pointer; transition: color 0.15s; }
        .star-bar .star:hover, .star-bar .star.hovered { color: #ffb703; }
        .star-bar .star.active { color: #f24b1f; text-shadow: 0 0 6px rgba(242, 75, 31, 0.6); }

        .profile-card { background: #1f1f1f; border: 1px solid #333; border-radius: 16px; padding: 24px; text-align: center; max-width: 400px; margin: 20px auto; }
        .downnavbarmain { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; height: 50px; background-color: rgba(36, 36, 36, 0.9); backdrop-filter: blur(12px); border-radius: 12px; z-index: 1000; display: flex; align-items: center; justify-content: space-around; border: 1px solid #333; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #888; cursor: pointer; font-size: 10px; }
        .nav-item.active { color: #f24b1f; }
        .nav-item ion-icon { font-size: 20px; }
    </style>
</head>
<body>

    <!-- ВКЛАДКА 1: ГЛАВНАЯ -->
    <div id="tab-home" class="tab-content active">
        <h3 style="margin-bottom: 12px;">📚 Каталог Аниме (Народный Рейтинг):</h3>
        <div id="catalog-grid" class="cards-grid"></div>
    </div>

    <!-- ВКЛАДКА 2: МОЁ -->
    <div id="tab-library" class="tab-content">
        <h3 style="margin-bottom: 12px;">📌 Ваша библиотека:</h3>
        <div id="library-grid" class="cards-grid"></div>
    </div>

    <!-- ВКЛАДКА 3: ПРОФИЛЬ -->
    <div id="tab-profile" class="tab-content">
        <div class="profile-card">
            <div style="font-size: 48px; margin-bottom: 10px;">👤</div>
            <h2 id="profile-name">Загрузка...</h2>
            <p id="profile-id" style="color: #4caf50; font-weight: bold; margin: 10px 0;">ID: ...</p>
        </div>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ -->
    <div class="downnavbarmain">
        <div class="nav-item active" onclick="switchTab('home', this)"><ion-icon name="home"></ion-icon><span>Главная</span></div>
        <div class="nav-item" onclick="switchTab('library', this)"><ion-icon name="bookmark"></ion-icon><span>Моё</span></div>
        <div class="nav-item" onclick="switchTab('profile', this)"><ion-icon name="person"></ion-icon><span>Профиль</span></div>
    </div>

    <script>
        const API_URL = 'https://functions.yandexcloud.net/d4evib2sgptv8r0rvtht';

        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }

        // Каталог БЕЗ ЗАРАНЕЕ ПРОПИСАННЫХ РЕЙТИНГОВ
        let catalogData = {
            '001': { id: '001', title: 'Атака Титанов', poster_url: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500' },
            '002': { id: '002', title: 'Наруто: Ураганные хроники', poster_url: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=500' },
            '003': { id: '003', title: 'Магическая битва', poster_url: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500' }
        };

        // Хранилище динамических рейтингов
        let globalRatings = {};
        let userStore = { items: {} };

        function getRealUser() {
            if (tg?.initDataUnsafe?.user?.id) {
                const u = tg.initDataUnsafe.user;
                return { id: u.id.toString(), name: u.first_name + (u.username ? ` (@${u.username})` : '') };
            }
            const shared = localStorage.getItem('tg_shared_user');
            if (shared) { try { return JSON.parse(shared); } catch(e){} }
            return { id: '100001', name: 'Гость' };
        }

        async function initApp() {
            const user = getRealUser();
            document.getElementById('profile-id').innerText = `ID: ${user.id}`;
            document.getElementById('profile-name').innerText = user.name;

            await fetchGlobalRatings();
            await loadUserLibrary();
            renderCatalogUI(catalogData, 'catalog-grid');
        }

        // Загрузка живых рейтингов с Яндекс Облака
        async function fetchGlobalRatings() {
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get_ratings' })
                });
                const data = await res.json();
                if (data.success) {
                    globalRatings = data.global_ratings || {};
                }
            } catch(e) {}
        }

        function renderCatalogUI(dataObj, containerId) {
            const container = document.getElementById(containerId);
            const keys = Object.keys(dataObj);

            if (keys.length === 0) {
                container.innerHTML = '<p style="color:#aaa;">Список пуст</p>';
                return;
            }

            container.innerHTML = keys.map(animeId => {
                const item = dataObj[animeId];
                const ratingInfo = globalRatings[animeId];
                
                // Вычисляем отображение рейтинга
                const badgeText = (ratingInfo && ratingInfo.count > 0)
                    ? `★ ${ratingInfo.avg} (${ratingInfo.count})`
                    : `★ Нет оценок`;

                let starsHtml = '';
                for (let i = 1; i <= 10; i++) {
                    starsHtml += `<span class="star" data-val="${i}" onclick="rateAnime('${animeId}', ${i})" onmouseover="hoverStars('${animeId}', ${i})" onmouseout="resetStars('${animeId}')">★</span>`;
                }

                return `
                    <div class="card-tile" id="card-${animeId}">
                        <div class="poster-wrapper">
                            <img src="${item.poster_url}" alt="${item.title}">
                            <!-- НАСТОЯЩИЙ НАРОДНЫЙ РЕЙТИНГ -->
                            <div class="rating-badge" id="badge-${animeId}">${badgeText}</div>
                        </div>

                        <div class="card-details">
                            <h3>${item.title}</h3>

                            <div class="status-buttons">
                                <div class="btn-status" onclick="setStatus('${animeId}', 'watching')">👀 Смотрю</div>
                                <div class="btn-status" onclick="setStatus('${animeId}', 'completed')">✅ Просмотрено</div>
                                <div class="btn-status" onclick="setStatus('${animeId}', 'planned')">📌 В планах</div>
                                <div class="btn-status" onclick="setStatus('${animeId}', 'dropped')">❌ Брошено</div>
                            </div>

                            <div class="personal-rating-box">
                                <div class="personal-rating-title">
                                    <span>Ваша оценка:</span>
                                    <strong id="my-rating-${animeId}" style="color:#f24b1f;">-</strong>
                                </div>
                                <div class="star-bar" id="star-bar-${animeId}">
                                    ${starsHtml}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            applyUserLibraryToUI();
        }

        // ⭐ ГОЛОСОВАНИЕ И ПЕРЕСЧЕТ РЕЙТИНГА В РЕАЛЬНОМ ВРЕМЕНИ
        async function rateAnime(animeId, score) {
            userStore.items = userStore.items || {};
            const current = userStore.items[animeId] || { status: 'none', rating: 0 };
            current.rating = score;
            current.title = catalogData[animeId]?.title || `Аниме #${animeId}`;
            userStore.items[animeId] = current;

            applyUserLibraryToUI();
            saveUserLibraryLocally();

            // Отправляем голос на Яндекс Облако
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'rate_and_sync',
                        initData: tg?.initData || "",
                        user_id: getRealUser().id,
                        user_name: getRealUser().name,
                        anime_id: animeId,
                        score: score,
                        items: userStore.items
                    })
                });

                const data = await res.json();
                if (data.success && data.new_global_rating) {
                    // МГНОВЕННО обновляем плашку с новым народным рейтингом!
                    globalRatings[animeId] = data.new_global_rating;
                    const badge = document.getElementById(`badge-${animeId}`);
                    if (badge) {
                        badge.innerText = `★ ${data.new_global_rating.avg} (${data.new_global_rating.count})`;
                    }
                }
            } catch(e) {}
        }

        function hoverStars(animeId, val) {
            const bar = document.getElementById(`star-bar-${animeId}`);
            if (bar) bar.querySelectorAll('.star').forEach((s, i) => s.classList.toggle('hovered', i < val));
        }

        function resetStars(animeId) {
            const bar = document.getElementById(`star-bar-${animeId}`);
            if (bar) bar.querySelectorAll('.star').forEach(s => s.classList.remove('hovered'));
        }

        async function setStatus(animeId, statusName) {
            userStore.items = userStore.items || {};
            const current = userStore.items[animeId] || { status: 'none', rating: 0 };
            current.status = (current.status === statusName) ? 'none' : statusName;
            current.title = catalogData[animeId]?.title || `Аниме #${animeId}`;
            userStore.items[animeId] = current;

            applyUserLibraryToUI();
            saveUserLibraryLocally();
        }

        function applyUserLibraryToUI() {
            userStore.items = userStore.items || {};
            Object.keys(catalogData).forEach(animeId => {
                const cardEl = document.getElementById(`card-${animeId}`);
                if (!cardEl) return;
                const itemData = userStore.items[animeId] || { status: 'none', rating: 0 };

                const ratingDisplay = document.getElementById(`my-rating-${animeId}`);
                if (ratingDisplay) ratingDisplay.innerText = itemData.rating > 0 ? `${itemData.rating}/10` : '-';

                const starBar = document.getElementById(`star-bar-${animeId}`);
                if (starBar) {
                    starBar.querySelectorAll('.star').forEach((s, idx) => s.classList.toggle('active', idx < itemData.rating));
                }

                const btns = cardEl.querySelectorAll('.btn-status');
                btns.forEach(btn => {
                    btn.className = 'btn-status';
                    const text = btn.innerText;
                    if (text.includes('Смотрю') && itemData.status === 'watching') btn.classList.add('act-watching');
                    if (text.includes('Просмотрено') && itemData.status === 'completed') btn.classList.add('act-completed');
                    if (text.includes('планах') && itemData.status === 'planned') btn.classList.add('act-planned');
                    if (text.includes('Брошено') && itemData.status === 'dropped') btn.classList.add('act-dropped');
                });
            });
        }

        function loadUserLibrary() {
            return new Promise((resolve) => {
                const cloudKey = `library_${getRealUser().id}`;
                if (tg?.CloudStorage) {
                    tg.CloudStorage.getItem(cloudKey, (err, val) => {
                        if (!err && val) { try { userStore = JSON.parse(val); } catch(e){} }
                        resolve();
                    });
                } else {
                    const saved = localStorage.getItem(cloudKey);
                    if (saved) { try { userStore = JSON.parse(saved); } catch(e){} }
                    resolve();
                }
            });
        }

        function saveUserLibraryLocally() {
            const cloudKey = `library_${getRealUser().id}`;
            if (tg?.CloudStorage) tg.CloudStorage.setItem(cloudKey, JSON.stringify(userStore));
            else localStorage.setItem(cloudKey, JSON.stringify(userStore));
        }

        function switchTab(tabName, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById(`tab-${tabName}`).classList.add('active');
            el.classList.add('active');

            if (tabName === 'library') {
                const savedItems = {};
                Object.keys(userStore.items || {}).forEach(id => {
                    if (userStore.items[id].status !== 'none' || userStore.items[id].rating > 0) {
                        if (catalogData[id]) savedItems[id] = catalogData[id];
                    }
                });
                renderCatalogUI(savedItems, 'library-grid');
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
