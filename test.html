<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кинотеатр</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .centered-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 32px 24px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 12px 32px rgba(0,0,0,0.6);
        }

        .nickname-box {
            font-size: 18px;
            color: #f24b1f;
            font-weight: bold;
            margin-bottom: 24px;
        }

        button.primary-btn {
            width: 100%;
            padding: 14px;
            background: #f24b1f;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 14px;
        }

        .alt-link {
            background: none;
            border: none;
            color: #888;
            font-size: 13px;
            cursor: pointer;
            text-decoration: underline;
        }

        .back-btn {
            background: #2a2a2a;
            color: #ccc;
            border: 1px solid #444;
            padding: 10px;
            width: 100%;
            border-radius: 8px;
            margin-top: 12px;
            cursor: pointer;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 16px 0;
            border-radius: 8px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            text-align: center;
        }

        .app-container {
            padding: 16px;
            max-width: 800px;
            margin: 0 auto;
        }

        .header-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .badge {
            background: #2e7d32;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            float: right;
        }

        .anime-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (min-width: 520px) {
            .anime-grid { grid-template-columns: 1fr 1fr; }
        }

        /* Карточка с Постером */
        .anime-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 14px;
            padding: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .poster-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
            background: #111;
        }

        .anime-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin: 10px 0;
        }

        .status-btn {
            padding: 8px;
            font-size: 11px;
            background: #2a2a2a;
            color: #ccc;
            border: 1px solid #444;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
        }

        .status-btn.active-watching { background: #1976d2; color: #fff; }
        .status-btn.active-completed { background: #2e7d32; color: #fff; }
        .status-btn.active-planned { background: #ed6c02; color: #fff; }
        .status-btn.active-dropped { background: #d32f2f; color: #fff; }

        .episodes-box {
            background: #141414;
            padding: 8px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 12px;
        }

        .ep-btn {
            display: inline-block;
            background: #333;
            color: #fff;
            padding: 4px 8px;
            margin: 2px;
            border-radius: 4px;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <!-- 1. ЦЕНТРИРОВАННЫЙ ЭКРАН ВХОДА -->
    <div id="screen-prompt" class="centered-container" style="display: none;">
        <div class="auth-card">
            <div style="font-size: 24px; font-weight: bold; margin-bottom: 6px;">Привет! 👋</div>
            <div id="prompt-nickname" class="nickname-box">Загрузка...</div>

            <button class="primary-btn" onclick="confirmLogin()">Войти</button>

            <div>
                <button class="alt-link" onclick="showManualScreen()">(Войти по другому Telegram ID)</button>
            </div>
        </div>
    </div>

    <!-- 2. ЭКРАН РУЧНОГО ВВОДА ID -->
    <div id="screen-manual" class="centered-container" style="display: none;">
        <div class="auth-card">
            <h3 style="margin: 0 0 8px 0;">Вход по другому ID</h3>
            <p style="color: #aaa; font-size: 12px; margin: 0;">Введите Telegram ID профиля:</p>

            <input type="text" id="manual-input-id" placeholder="Например: 593810291">

            <button class="primary-btn" onclick="loginManual()">Войти в этот аккаунт</button>
            
            <button id="btn-back-to-nickname" class="back-btn" onclick="backToPrompt()">
                ⬅️ Вернуться назад
            </button>
        </div>
    </div>

    <!-- 3. ОСНОВНОЙ ИНТЕРФЕЙС КАТАЛОГА -->
    <div id="screen-app" class="app-container" style="display: none;">
        <div class="header-card">
            <span id="sync-status" class="badge">⚡ Вход выполнен</span>
            <button onclick="logout()" style="float: right; margin-right: 8px; background:#333; color:#aaa; border:none; padding:4px 8px; border-radius:4px; font-size:11px; cursor:pointer;">Выйти</button>
            <h3 style="margin: 0 0 8px 0;">Ваш Профиль</h3>
            <p style="margin: 4px 0;"><strong>Telegram ID:</strong> <span id="app-user-id" style="color: #4caf50; font-weight: bold;">...</span></p>
            <p style="margin: 4px 0;"><strong>Никнейм:</strong> <span id="app-user-name">...</span></p>
        </div>

        <h3 style="margin-bottom: 16px;">📚 Авто-Каталог из Канала (-1003952561478):</h3>

        <div id="anime-grid-container" class="anime-grid">
            <!-- Плитки с постерами загружаются динамически -->
        </div>
    </div>

    <script>
        const API_URL = 'https://functions.yandexcloud.net/d4evib2sgptv8r0rvtht';

        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        let detectedUser = null;
        let activeUser = null;

        let catalogData = {};
        let userStore = { items: {} };

        function findUser() {
            if (tg?.initDataUnsafe?.user?.id) {
                const u = tg.initDataUnsafe.user;
                return {
                    id: u.id.toString(),
                    name: u.first_name + (u.username ? ` (@${u.username})` : '')
                };
            }
            const shared = localStorage.getItem('tg_shared_user');
            if (shared) { try { return JSON.parse(shared); } catch(e){} }
            return null;
        }

        function initCheck() {
            const confirmedSession = localStorage.getItem('confirmed_user_session');
            if (confirmedSession) {
                try {
                    activeUser = JSON.parse(confirmedSession);
                    enterApp();
                    return;
                } catch(e){}
            }

            detectedUser = findUser();

            if (detectedUser) {
                document.getElementById('screen-prompt').style.display = 'flex';
                document.getElementById('screen-manual').style.display = 'none';
                document.getElementById('screen-app').style.display = 'none';

                document.getElementById('prompt-nickname').innerText = detectedUser.name;
                document.getElementById('btn-back-to-nickname').innerText = `⬅️ Вернуться назад к ${detectedUser.name}`;
                return;
            }

            showManualScreen();
        }

        function confirmLogin() {
            activeUser = detectedUser;
            localStorage.setItem('confirmed_user_session', JSON.stringify(activeUser));
            enterApp();
        }

        function showManualScreen() {
            document.getElementById('screen-prompt').style.display = 'none';
            document.getElementById('screen-manual').style.display = 'flex';
            document.getElementById('screen-app').style.display = 'none';
        }

        function backToPrompt() {
            if (detectedUser) {
                document.getElementById('screen-prompt').style.display = 'flex';
                document.getElementById('screen-manual').style.display = 'none';
            }
        }

        function loginManual() {
            const inputVal = document.getElementById('manual-input-id').value.trim();
            if (!inputVal) return alert("Введите Telegram ID!");

            activeUser = { id: inputVal, name: `Пользователь #${inputVal}` };
            localStorage.setItem('confirmed_user_session', JSON.stringify(activeUser));
            enterApp();
        }

        async function enterApp() {
            document.getElementById('screen-prompt').style.display = 'none';
            document.getElementById('screen-manual').style.display = 'none';
            document.getElementById('screen-app').style.display = 'block';

            document.getElementById('app-user-id').innerText = activeUser.id;
            document.getElementById('app-user-name').innerText = activeUser.name;

            await fetchCatalog();
            await loadLibrary();
        }

        function logout() {
            localStorage.removeItem('confirmed_user_session');
            location.reload();
        }

        // Загрузка каталога с Постерами из Яндекс Облака
        async function fetchCatalog() {
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get_catalog' })
                });
                const data = await res.json();
                if (data.success) {
                    catalogData = data.catalog || {};
                    renderCatalogUI();
                }
            } catch(e) { console.error("Ошибка загрузки каталога:", e); }
        }

        function renderCatalogUI() {
            const container = document.getElementById('anime-grid-container');
            const keys = Object.keys(catalogData);

            if (keys.length === 0) {
                container.innerHTML = '<p style="color:#aaa;">Каталог пуст. Опубликуйте пост с картинкой и тегом #001 в канал -1003952561478</p>';
                return;
            }

            container.innerHTML = keys.map(animeId => {
                const item = catalogData[animeId];
                const posterTag = item.poster_url 
                    ? `<img src="${item.poster_url}" class="poster-img" alt="${item.title}">`
                    : `<div class="poster-img" style="display:flex;align-items:center;justify-content:center;color:#555;">Нет Постера</div>`;

                const seasonsHtml = Object.keys(item.seasons || {}).map(sNum => {
                    const eps = Object.keys(item.seasons[sNum] || {}).map(epNum => 
                        `<span class="ep-btn">С${sNum} Е${epNum}</span>`
                    ).join('');
                    return `<div><small style="color:#888;">Сезон ${sNum}:</small> ${eps}</div>`;
                }).join('');

                return `
                    <div class="anime-card" id="card-${animeId}">
                        <div>
                            ${posterTag}
                            <div class="anime-title">
                                <span>${item.title || ('Аниме #' + animeId)}</span>
                                <button style="background:none;border:none;font-size:20px;cursor:pointer;" onclick="toggleFav('${animeId}')">🤍</button>
                            </div>
                            <div class="status-group">
                                <div class="status-btn" onclick="setStatus('${animeId}', 'watching')">👀 Смотрю</div>
                                <div class="status-btn" onclick="setStatus('${animeId}', 'completed')">✅ Просмотрено</div>
                                <div class="status-btn" onclick="setStatus('${animeId}', 'planned')">📌 В планах</div>
                                <div class="status-btn" onclick="setStatus('${animeId}', 'dropped')">❌ Брошено</div>
                            </div>
                        </div>
                        <div class="episodes-box">
                            <strong>Серии из канала:</strong>
                            ${seasonsHtml || '<div style="color:#666;">Серии не привязаны</div>'}
                        </div>
                    </div>
                `;
            }).join('');

            renderLibraryState();
        }

        function loadLibrary() {
            return new Promise((resolve) => {
                const cloudKey = `library_${activeUser.id}`;
                if (tg?.CloudStorage) {
                    tg.CloudStorage.getItem(cloudKey, (err, val) => {
                        if (!err && val) { try { userStore = JSON.parse(val); } catch(e){} }
                        renderLibraryState();
                        resolve();
                    });
                } else {
                    const saved = localStorage.getItem(cloudKey);
                    if (saved) { try { userStore = JSON.parse(saved); } catch(e){} }
                    renderLibraryState();
                    resolve();
                }
            });
        }

        function renderLibraryState() {
            userStore.items = userStore.items || {};
            Object.keys(userStore.items).forEach(animeId => {
                const cardEl = document.getElementById(`card-${animeId}`);
                if (!cardEl) return;
                const itemData = userStore.items[animeId];

                const statusBtns = cardEl.querySelectorAll('.status-btn');
                statusBtns.forEach(btn => {
                    btn.className = 'status-btn';
                    const text = btn.innerText;
                    if (text.includes('Смотрю') && itemData.status === 'watching') btn.classList.add('active-watching');
                    if (text.includes('Просмотрено') && itemData.status === 'completed') btn.classList.add('active-completed');
                    if (text.includes('планах') && itemData.status === 'planned') btn.classList.add('active-planned');
                    if (text.includes('Брошено') && itemData.status === 'dropped') btn.classList.add('active-dropped');
                });
            });
        }

        async function setStatus(animeId, statusName) {
            userStore.items = userStore.items || {};
            const current = userStore.items[animeId] || { status: 'none', rating: 0, is_fav: false };
            current.status = (current.status === statusName) ? 'none' : statusName;
            userStore.items[animeId] = current;
            renderLibraryState();
            await saveLibrary();
        }

        async function saveLibrary() {
            document.getElementById('sync-status').innerText = '⚡ Сохранение...';
            const cloudKey = `library_${activeUser.id}`;
            if (tg?.CloudStorage) {
                tg.CloudStorage.setItem(cloudKey, JSON.stringify(userStore));
            } else {
                localStorage.setItem(cloudKey, JSON.stringify(userStore));
            }

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'update_channel',
                    initData: localStorage.getItem('tg_shared_initdata') || tg?.initData || "",
                    user_id: activeUser.id,
                    user_name: activeUser.name,
                    items: userStore.items
                })
            }).then(() => {
                document.getElementById('sync-status').innerText = '⚡ Синхронизировано';
            });
        }

        document.addEventListener('DOMContentLoaded', initCheck);
    </script>
</body>
</html>
